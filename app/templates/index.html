<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI 猎手雷达" />
  <meta name="format-detection" content="telephone=no" />
  <title>AI 新物种猎手雷达 · AI Tech Radar</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2322d3ee'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-size='36' font-weight='800' fill='%23041019'%3ER%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/css/style.css?v=10" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-logo">R</div>
        <div>
          <h1 class="brand-title" data-i18n="brandTitle">AI 新物种猎手雷达</h1>
          <p class="brand-sub" data-i18n="brandSub">5 源无词捕获 · 书签收藏比提纯 · 评论区一楼穿透 · TypeSafe Jev 终审</p>
        </div>
      </div>

      <div class="status-group">
        <div class="lang-switch" id="ui-lang-switch" title="切换项目界面语言 / Switch UI Language">
          <button class="lang-btn active" data-ui-lang="zh" type="button">中文</button>
          <button class="lang-btn" data-ui-lang="en" type="button">EN</button>
        </div>
        <button class="btn-ghost" id="btn-auth-account" type="button">🔑 登录</button>
      </div>
    </header>

    <!-- 5 Data Sources Control Panel -->
    <section class="scanner-panel">
      <div class="sources-row">
        <span class="row-label" data-i18n="sourcesLabel">数据源 (勾谁看谁 & 扫谁)：</span>
        <button class="btn-ghost" id="btn-select-all-sources" type="button" data-i18n="btnSelectAll">全选</button>
        <label class="source-toggle checked">
          <input type="checkbox" value="x" checked />
          <span data-i18n="srcX">𝕏 推荐/关注 & 热榜联动</span>
          <em id="cnt-x">0</em>
        </label>
        <label class="source-toggle checked">
          <input type="checkbox" value="huggingface" checked />
          <span data-i18n="srcHf">🤗 HuggingFace 飙升榜</span>
          <em id="cnt-huggingface">0</em>
        </label>
        <label class="source-toggle checked">
          <input type="checkbox" value="github" checked />
          <span data-i18n="srcGh">📦 GitHub 暴涨新库</span>
          <em id="cnt-github">0</em>
        </label>
        <label class="source-toggle checked">
          <input type="checkbox" value="reddit" checked />
          <span data-i18n="srcRd">👽 Reddit 实测热帖</span>
          <em id="cnt-reddit">0</em>
        </label>
        <label class="source-toggle checked">
          <input type="checkbox" value="hackernews" checked />
          <span data-i18n="srcHn">🟧 HN 极客手搓</span>
          <em id="cnt-hackernews">0</em>
        </label>
        <button class="tab" id="btn-starred-toggle" type="button">
          <span data-i18n="btnStarred">⭐ 收藏夹</span> (<span id="cnt-starred">0</span>)
        </button>
      </div>

      <div class="scan-action-row">
        <div class="scan-controls">
          <select id="max-judge-select">
            <option value="18" selected data-i18n="optJudge18">Jev 精判 Top 18 条</option>
            <option value="26" data-i18n="optJudge26">Jev 精判 Top 26 条</option>
            <option value="40" data-i18n="optJudge40">Jev 精判 Top 40 条</option>
          </select>
          <button class="btn-scan" id="btn-scan" type="button" data-i18n="btnScan">⚡ 立即扫描已勾选源</button>
          <button class="btn-translate-page" id="btn-translate-page" type="button">🌐 翻译本页未翻项</button>
        </div>
        <div class="scan-log" id="scan-log" data-i18n="scanHint">勾选上方数据源实时过滤列表；管理员登录态下扫描会自动按赛道提炼 ≥70 分中文干货（未登录仅抓取与打分）</div>
      </div>
    </section>

    <!-- Filter & Search Bar -->
    <section class="filter-panel">
      <div class="category-chips" id="category-chips">
        <button class="chip active" data-cat="all" type="button" data-i18n="catAll">全部赛道</button>
        <button class="chip" data-cat="IMAGE_VIDEO_AUDIO" type="button" data-i18n="catMedia">🎬 视频·生图·语音·3D</button>
        <button class="chip" data-cat="MODEL_WEIGHTS" type="button" data-i18n="catModel">🧠 开源模型 & 权重</button>
        <button class="chip" data-cat="LOCAL_HACK" type="button" data-i18n="catLocal">⚡ 低显存部署 / 白嫖算力</button>
        <button class="chip" data-cat="WILD_PROJECT" type="button" data-i18n="catWild">🛠️ AI 实战野生项目</button>
        <button class="chip" data-cat="AGENT_TOOL" type="button" data-i18n="catAgent">🤖 Agent / 自动化工具</button>
      </div>

      <div class="sub-filters">
        <input type="search" id="search-input" enterkeyhint="search" autocapitalize="none" autocorrect="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder" placeholder="搜项目名、模型、ComfyUI、GGUF、TTS、Agent..." />
        <label class="mini-check">
          <input type="checkbox" id="chk-ready-only" />
          <span data-i18n="chkReady">🟢 只看立即可玩/已开源</span>
        </label>
        <label class="mini-check">
          <input type="checkbox" id="chk-video-only" />
          <span data-i18n="chkVideo">🎬 只看带演示视频</span>
        </label>
        <select id="time-select">
          <option value="24" data-i18n="time24h">时间：24小时内</option>
          <option value="72" selected data-i18n="time3d">时间：近 3 天</option>
          <option value="168" data-i18n="time7d">时间：近 7 天</option>
          <option value="0" data-i18n="timeAll">时间：全部历史</option>
        </select>
        <select id="sort-select">
          <option value="combo" selected data-i18n="sortCombo">排序：综合爆款度 (Jev + 20w查看 + 开源)</option>
          <option value="views" data-i18n="sortViews">排序：🔥 查看量 (20w+ 爆款优先)</option>
          <option value="score" data-i18n="sortScore">排序：纯 Jev 技术分 (高 → 低)</option>
          <option value="bookmarks" data-i18n="sortBookmarks">排序：干货收藏密度 / Star</option>
          <option value="latest" data-i18n="sortLatest">排序：发布时间最新</option>
        </select>
        <span class="result-counter" id="result-counter">0 个项目</span>
      </div>
    </section>

    <!-- Cards Feed -->
    <main class="cards-grid" id="cards-grid">
      <div class="empty-state" data-i18n="loadingFeed">正在读取本地情报库...</div>
    </main>

    <!-- Pagination -->
    <nav class="pagination-bar hidden" id="pagination-bar" aria-label="Pagination"></nav>
  </div>

  <!-- Admin Account Login Modal -->
  <div class="modal-backdrop hidden" id="auth-modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 data-i18n="authTitle">管理员登录</h3>
        <button class="modal-close" id="btn-close-auth" type="button">✕</button>
      </div>
      <p class="modal-tip" data-i18n="authTip">登录后可使用中文提炼翻译功能（浏览、扫描与收藏无需登录）。</p>
      <div class="form-field">
        <label data-i18n="lblAuthUser">账号</label>
        <input type="text" id="inp-auth-user" placeholder="输入管理员账号" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" />
      </div>
      <div class="form-field">
        <label data-i18n="lblAuthPass">密码</label>
        <input type="password" id="inp-auth-pass" placeholder="输入密码" autocomplete="current-password" enterkeyhint="go" />
      </div>
      <p class="modal-tip" id="auth-msg" style="color: #38bdf8; min-height: 18px;"></p>
      <div class="modal-actions">
        <button class="btn-scan" id="btn-submit-auth" type="button" data-i18n="btnLogin">登录</button>
        <button class="btn-ghost" id="btn-cancel-auth" type="button" data-i18n="btnCancel">取消</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js?v=14"></script>
</body>
</html>
